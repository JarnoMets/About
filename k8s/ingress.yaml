apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: about-ingress
  namespace: about
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: about.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: about-frontend
            port:
              number: 80
