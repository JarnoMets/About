apiVersion: apps/v1
kind: Deployment
metadata:
  name: about-frontend
  namespace: about
spec:
  replicas: 1
  selector:
    matchLabels:
      app: about-frontend
  template:
    metadata:
      labels:
        app: about-frontend
    spec:
      containers:
      - name: about-frontend
        image: about-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: about-frontend
  namespace: about
spec:
  selector:
    app: about-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
